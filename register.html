<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Create account — E&B MARKETIZA</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar"><a class="brand" href="index.html">E-B.MARKETIZA</a></header>
<main class="auth-wrap">
  <form id="registerForm" class="card form-card">
    <h1>Create your account</h1><p class="muted">Choose whether you want to buy or sell.</p>
    <label>Full name<input id="name" type="text" required autocomplete="name"></label>
    <label>Email<input id="email" type="email" required autocomplete="email"></label>
    <label>Password<input id="password" type="password" minlength="6" required autocomplete="new-password"></label>
    <label>Account type
      <select id="role" required>
        <option value="buyer">Buyer</option>
        <option value="seller">Seller</option>
      </select>
    </label>
    <button class="btn primary full" type="submit">Create account</button>
    <div id="message" class="message"></div>
    <p class="small">Already have an account? <a href="login.html">Log in</a></p>
  </form>
</main>
<script type="module" src="assets/auth.js"></script>
</body>
</html>
