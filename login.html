<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Log in — E&B MARKETIZA</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar"><a class="brand" href="index.html">E-B.MARKETIZA</a></header>
<main class="auth-wrap">
  <form id="loginForm" class="card form-card">
    <h1>Welcome back</h1><p class="muted">Log in to your E&B MARKETIZA account.</p>
    <label>Email<input id="email" type="email" required autocomplete="email"></label>
    <label>Password<input id="password" type="password" required autocomplete="current-password"></label>
    <button class="btn primary full" type="submit">Log in</button>
    <div id="message" class="message"></div>
    <p class="small">Don't have an account? <a href="register.html">Create one</a></p>
  </form>
</main>
<script type="module" src="assets/auth.js"></script>
</body>
</html>
