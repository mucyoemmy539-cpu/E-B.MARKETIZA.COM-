<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Seller Dashboard — E&B MARKETIZA</title>
  <link rel="stylesheet" href="assets/style.css">
</head>
<body>
<header class="topbar">
  <a class="brand" href="index.html">E-B.MARKETIZA</a>
  <nav><button id="logoutBtn" class="btn ghost">Log out</button></nav>
</header>
<main class="dashboard">
  <div class="dash-head">
    <div><span class="eyebrow">SELLER CENTER</span><h1>Seller Dashboard</h1><p id="welcome" class="muted"></p></div>
    <button class="btn primary" id="addProductBtn" type="button">+ Add product</button>
  </div>
  <section class="stats">
    <div class="stat"><span>Products</span><strong id="productCount">0</strong></div>
    <div class="stat"><span>Orders</span><strong>0</strong></div>
    <div class="stat"><span>Sales</span><strong>$0</strong></div>
  </section>
  <section class="card">
    <h2>Your products</h2>
    <div id="products" class="empty">No products yet. Product management is the next build step.</div>
  </section>
</main>

<div id="productModal" class="modal hidden">
  <form id="productForm" class="card modal-card">
    <button type="button" id="closeModal" class="close">×</button>
    <h2>Add a product</h2>
    <p class="muted">This form is prepared for Step 4.</p>
    <label>Product name<input id="productName" required></label>
    <label>Price<input id="productPrice" type="number" min="0" step="0.01" required></label>
    <button class="btn primary full" type="submit">Save product</button>
    <div id="productMessage" class="message"></div>
  </form>
</div>
<script type="module" src="assets/dashboard.js"></script>
</body>
</html>
